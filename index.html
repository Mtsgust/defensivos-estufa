<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Estufas — Controle</title>
<style>
  :root{
    --bg:#F2F5EF;
    --ink:#1D2B22;
    --leaf:#234D35;
    --leaf-dark:#173425;
    --paper:#FFFFFF;
    --line:#DCE3D8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:32px 20px;
  }
  .eyebrow{
    font-family:ui-monospace,"SF Mono",Menlo,monospace;
    font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--leaf); margin-bottom:6px;
  }
  h1{font-size:26px; margin:0 0 28px; text-align:center;}
  .cards{width:100%; max-width:420px; display:flex; flex-direction:column; gap:16px;}
  a.card{
    display:block; background:var(--paper); border:1px solid var(--line);
    border-radius:14px; padding:22px 20px; text-decoration:none; color:var(--ink);
    box-shadow:0 1px 2px rgba(23,52,37,.06);
  }
  a.card:active{transform:scale(.98);}
  .card .tag{
    display:inline-block; font-family:ui-monospace,monospace; font-size:11px;
    background:var(--leaf); color:#fff; padding:2px 8px; border-radius:5px;
    letter-spacing:.06em; margin-bottom:10px;
  }
  .card h2{margin:0 0 6px; font-size:19px; color:var(--leaf-dark);}
  .card p{margin:0; font-size:14px; color:#54614F;}
</style>
</head>
<body>
  <div class="eyebrow">Controle das estufas</div>
  <h1>O que você vai registrar?</h1>
  <div class="cards">
    <a class="card" href="pulverizacoes.html">
      <span class="tag">DEFENSIVOS</span>
      <h2>Pulverizações</h2>
      <p>Registrar aplicações feitas e marcar o que ainda precisa pulverizar.</p>
    </a>
    <a class="card" href="nutricao.html">
      <span class="tag">SOLO · BIOLÓGICOS</span>
      <h2>Nutrição</h2>
      <p>Lançar o plano semanal do técnico e marcar tratamento de solo, biológicos e afins.</p>
    </a>
  </div>
</body>
</html>
