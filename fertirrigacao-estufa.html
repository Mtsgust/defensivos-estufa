<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fertirrigação">
<title>Fertirrigação — Tomate Grape</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: #0d1a2a; color: #e3f0ff; font-family: Georgia, serif; min-height: 100vh; }
  #header { background: linear-gradient(135deg,#0d2a4a,#0d1a2a); border-bottom: 2px solid #1a4a7a; padding: 16px 16px 0; text-align: center; }
  #header h1 { font-size: 17px; color: #90caf9; letter-spacing: 1px; }
  #header p { font-size: 12px; color: #42a5f5; margin: 2px 0 12px; }
  .tabs { display: flex; justify-content: center; }
  .tab-btn { padding: 9px 16px; border: none; background: transparent; color: #1a6a9a; font-size: 12px; cursor: pointer; border-top: 2px solid transparent; border-radius: 6px 6px 0 0; font-family: Georgia, serif; }
  .tab-btn.active { background: #0d1a2a; color: #90caf9; font-weight: bold; border-top-color: #42a5f5; }
  .page { display: none; padding: 14px; max-width: 700px; margin: 0 auto; }
  .page.active { display: block; }
  input, select, textarea { background: #0d2233; border: 1px solid #1a4a7a; border-radius: 6px; color: #e3f0ff; padding: 9px 12px; font-size: 14px; width: 100%; outline: none; font-family: Georgia, serif; }
  input[type=date] { color-scheme: dark; }
  input::placeholder, textarea::placeholder { color: #1a4a6a; }
  .card { background: #0d2030; border-radius: 10px; border: 1px solid #1a4a7a; padding: 12px; margin-bottom: 14px; }
  .label { font-size: 11px; color: #64b5f6; font-family: monospace; letter-spacing: 1px; margin-bottom: 8px; }
  .sublabel { font-size: 11px; color: #1a6a9a; margin-bottom: 4px; }
  .row { display: flex; gap: 8px; margin-bottom: 10px; }
  .row > div { flex: 1; }
  .btn { width: 100%; padding: 11px; border-radius: 8px; border: none; font-size: 14px; font-weight: bold; cursor: pointer; font-family: Georgia, serif; transition: background 0.3s; }
  .btn-blue { background: #1565c0; color: #e3f0ff; }
  .btn-blue:disabled { background: #0d2233; color: #1a4a6a; cursor: not-allowed; }

  /* Lista de produtos */
  .prod-list { max-height: 280px; overflow-y: auto; border: 1px solid #1a3a5a; border-radius: 6px; margin-bottom: 10px; }
  .prod-item { border-bottom: 1px solid #1a3a5a; }
  .prod-item:last-child { border-bottom: none; }
  .prod-header { display: flex; align-items: center; gap: 10px; padding: 9px 12px; cursor: pointer; }
  .prod-header:active { background: #0d2a3a; }
  .prod-item.sel .prod-header { background: #0d2a4a; }
  .chk { width: 18px; height: 18px; border-radius: 4px; border: 2px solid #1a4a7a; background: transparent; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #0d1a2a; font-weight: bold; }
  .chk.on { background: #42a5f5; border-color: #42a5f5; }
  .prod-nome { font-size: 13px; color: #b3d9ff; flex: 1; }
  .prod-item.sel .prod-nome { color: #90caf9; font-weight: bold; }
  .prod-grupo { font-size: 10px; padding: 2px 7px; border-radius: 10px; color: #e3f0ff; white-space: nowrap; }
  .dose-row { display: flex; align-items: center; gap: 8px; padding: 6px 12px 8px 40px; background: #081828; }
  .dose-input { flex: 1; padding: 6px 10px; font-size: 13px; }
  .dose-unit { font-size: 11px; color: #42a5f5; white-space: nowrap; flex-shrink: 0; }

  /* Filtros */
  .filter-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .filter-btn { padding: 4px 10px; border-radius: 16px; border: 1px solid #1a4a7a; background: #0d2233; color: #64b5f6; font-size: 12px; cursor: pointer; font-family: Georgia, serif; }
  .filter-btn.active { background: #1565c0; color: #e3f0ff; border-color: #1565c0; }

  /* Cards de registro */
  .reg-card { background: #0d2030; border-radius: 8px; border: 1px solid #1a4a7a; padding: 12px; margin-bottom: 8px; }
  .reg-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
  .reg-estufa { font-weight: bold; color: #90caf9; font-size: 14px; }
  .reg-info { font-size: 12px; color: #1a6a9a; }
  .reg-produtos { margin-top: 6px; }
  .reg-prod-item { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; border-bottom: 1px solid #0d2a3a; font-size: 12px; }
  .reg-prod-item:last-child { border-bottom: none; }
  .reg-prod-nome { color: #90caf9; }
  .reg-prod-dose { color: #42a5f5; font-family: monospace; }
  .reg-obs { font-size: 12px; color: #4a7a9a; margin-top: 5px; font-style: italic; }
  .del-btn { padding: 3px 10px; border-radius: 6px; border: 1px solid #1a3a5a; background: transparent; color: #4a6a8a; font-size: 12px; cursor: pointer; font-family: Georgia, serif; }
  .del-confirm { display: flex; gap: 6px; }
  .del-yes { padding: 3px 10px; border-radius: 6px; border: none; background: #c62828; color: #fff; font-size: 12px; cursor: pointer; }
  .del-no { padding: 3px 10px; border-radius: 6px; border: 1px solid #1a4a7a; background: transparent; color: #64b5f6; font-size: 12px; cursor: pointer; }
  .empty { text-align: center; padding: 24px; color: #1a4a6a; font-size: 13px; }
  .status-msg { text-align: center; font-size: 12px; padding: 6px 0; min-height: 24px; }
  .loading { text-align: center; color: #1a6a9a; font-size: 13px; padding: 20px; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #1a4a7a; border-top-color: #42a5f5; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 6px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .dia-semana { font-size: 12px; color: #42a5f5; margin-top: 2px; }
  .count-badge { font-size: 11px; color: #42a5f5; }
  .combo-card { background: #0d2030; border-radius: 8px; border: 1px solid #1a4a7a; padding: 12px; margin-bottom: 8px; }
  .combo-nome { font-weight: bold; color: #90caf9; font-size: 14px; margin-bottom: 6px; }
  .combo-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
  .combo-tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #0d2a4a; border: 1px solid #1a4a7a; color: #90caf9; }
  .combo-use-btn { flex: 1; padding: 8px; border-radius: 6px; border: none; background: #1565c0; color: #e3f0ff; font-size: 13px; font-weight: bold; cursor: pointer; font-family: Georgia, serif; }
  .combo-del-btn { padding: 8px 14px; border-radius: 6px; border: 1px solid #1a3a5a; background: transparent; color: #4a6a8a; font-size: 12px; cursor: pointer; font-family: Georgia, serif; }
  .combo-actions { display: flex; gap: 6px; }
  .sel-preview { font-size: 11px; color: #42a5f5; padding: 6px 10px; background: #081828; border-radius: 6px; }
</style>
</head>
<body>

<div id="header">
  <div style="font-size:28px;margin-bottom:2px">💧</div>
  <h1>Fertirrigação — Tomate Grape</h1>
  <p>7 Estufas · Sistema no solo</p>
  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('registro',this)">📋 Registro</button>
    <button class="tab-btn" onclick="showTab('historico',this)">📂 Histórico</button>
    <button class="tab-btn" onclick="showTab('combos',this)">⚡ Combos</button>
  </div>
</div>

<!-- ABA NOVA APLICAÇÃO -->
<div id="tab-registro" class="page active">
  <div class="card">
    <div class="label">DADOS DA APLICAÇÃO</div>

    <div class="row">
      <div>
        <div class="sublabel">Estufa</div>
        <select id="sel-estufa">
          <option>Estufa 1</option><option>Estufa 2</option><option>Estufa 3</option>
          <option>Estufa 4</option><option>Estufa 5</option><option>Estufa 6</option><option>Estufa 7</option>
        </select>
      </div>
      <div>
        <div class="sublabel">Data</div>
        <input type="date" id="sel-data" onchange="atualizarDiaSemana()">
        <div class="dia-semana" id="dia-semana"></div>
      </div>
    </div>

    <div class="sublabel" style="margin-bottom:6px">Produtos e doses <span class="count-badge">(<span id="count-prod">0</span> selecionados)</span></div>
    <input type="text" id="busca-prod" placeholder="🔍 Buscar produto..." oninput="renderListaProd()" style="margin-bottom:6px">
    <div class="prod-list" id="lista-prod"></div>

    <div class="sublabel">Observações (opcional)</div>
    <input type="text" id="sel-obs" placeholder="ex: estágio da planta, condutividade, pH..." style="margin-bottom:12px">

    <button class="btn btn-blue" id="btn-salvar" onclick="salvarAplicacao()" disabled>💾 Salvar Aplicação</button>
    <div id="status-msg" class="status-msg"></div>
  </div>
</div>

<!-- ABA HISTÓRICO -->
<div id="tab-historico" class="page">
  <div class="label">HISTÓRICO (<span id="count-hist">0</span> registros)</div>
  <div class="filter-row" id="filtros-estufa"></div>
  <div id="historico"><div class="loading"><span class="spinner"></span>Carregando registros...</div></div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycby1-Ue6QRuplJDMD8-KjrvcZlbJHCiFPw3ERMJtD42QITdcpNi2TeqImjP6YT2tV__ZFA/exec";
const SHEET_TYPE = "fertirrigacao";

const DIAS = ["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];

const PRODUTOS = [
  // MACRONUTRIENTES / CONVENCIONAIS
  {id:"map_yara", nome:"MAP (Yara)", grupo:"Fósforo/Nitrogênio", unidade:"g/1000L", obs:"N 12% + P2O5 61% — Fosfato Monoamônio; enraizamento"},
  {id:"nitrato_calcio", nome:"Nitrato de Cálcio (Yara/Manuchar)", grupo:"Cálcio/Nitrogênio", unidade:"g/1000L", obs:"N 15,5% + Ca 19% — pronta assimilação; previne podridão apical"},
  {id:"sulfato_potassio", nome:"Sulfato de Potássio (Yara)", grupo:"Potássio/Enxofre", unidade:"g/1000L", obs:"K2O 50% + S 18% — isento de cloro; qualidade dos frutos"},
  {id:"sulfato_magnesio", nome:"Sulfato de Magnésio (Safire)", grupo:"Magnésio/Enxofre", unidade:"g/1000L", obs:"MgO 16% + S 13% — corrige clorose magnésica; melhora fotossíntese"},
  {id:"carbonato_calcio", nome:"Carbonato de Cálcio (Solo Rica)", grupo:"Correção/Cálcio", unidade:"g/1000L", obs:"CaCO3 ≥95% — correção de acidez; fonte de cálcio"},
  // FOLIARES BIOLCHIM
  {id:"magnitron", nome:"Magnitron (Biolchim)", grupo:"Magnésio", unidade:"ml/1000L", obs:"Mg ~9-11% + N ~11% (Nitrato de Magnésio) — fotossíntese"},
  {id:"boromin", nome:"Boromin (Biolchim)", grupo:"Boro", unidade:"ml/1000L", obs:"B ~11% complexado com MEA — pegamento floral e frutificação"},
  {id:"fosfitocobre", nome:"Fosfito de Cobre (Biolchim)", grupo:"Fosfito/Cobre", unidade:"ml/1000L", obs:"P2O5 ~40% + Cu ~5% — fitofortificante; Phytophthora, Pythium"},
  {id:"microfol", nome:"Microfol (Biolchim)", grupo:"Micronutrientes", unidade:"ml/1000L", obs:"Mg, S, B, Cu, Fe, Mn, Zn quelados — correção múltipla"},
  // FOLIARES NUTRICELER
  {id:"comboceler", nome:"Comboceler Multiminerais (Nutriceler)", grupo:"Micronutrientes", unidade:"ml/1000L", obs:"B, Cu, Fe, Mn, Mo, Zn quelatos — deficiências múltiplas"},
  {id:"zinconutriceler", nome:"Zinco (Nutriceler)", grupo:"Zinco", unidade:"ml/1000L", obs:"Zinco quelado alta concentração — ativa enzimas e auxinas"},
  {id:"manganesnutriceler", nome:"Manganês (Nutriceler)", grupo:"Manganês", unidade:"ml/1000L", obs:"Manganês quelado alta concentração — fotossíntese e enzimas"},
  // FOLIARES TECHNES
  {id:"aminon25", nome:"Aminon 25 (Technes)", grupo:"Aminoácidos", unidade:"ml/1000L", obs:"Aminoácidos livres + N 11% + K2O 1% — bioestimulante; estresse"},
  {id:"carbos", nome:"Carbos (Technes)", grupo:"Potássio/Carbono", unidade:"ml/1000L", obs:"K2O + carbono orgânico — estimula metabolismo; melhora brix"},
  {id:"pectus", nome:"Pectus (Technes)", grupo:"Ca/B/Aminoácidos", unidade:"ml/1000L", obs:"Ca + B + aminoácidos — pegamento floral; estrutura celular"},
  // FOLIARES FERTIQUÍMICA
  // FOLIARES PLANT QUALITY
  {id:"plantroot", nome:"Plant Root (Plant Quality)", grupo:"Bioestimulante Radicular", unidade:"ml/1000L", obs:"Aminoácidos + auxinas/citocininas — enraizamento e vigor inicial"},
  // FOLIARES WISER
  {id:"cleanup", nome:"Clean Up Wiser", grupo:"Adjuvante/Solo", unidade:"ml/1000L", obs:"Ácidos húmicos + fúlvicos — limpeza de emissores; reduz salinidade"},
  // OUTROS
  {id:"sopao", nome:"Sopão", grupo:"NPK Complexo", unidade:"ml/1000L", obs:"Fertilizante complexo — nutrição geral"},
  {id:"enraizador", nome:"Enraizador", grupo:"Bioestimulante", unidade:"ml/1000L", obs:"Estimula enraizamento e absorção de nutrientes"},
  {id:"biologicos", nome:"Biológicos", grupo:"Biocontrole", unidade:"ml/1000L", obs:"Controle biológico — Bacillus spp., Trichoderma, etc."},
  // DEFENSIVOS NA FERTIRRIGAÇÃO
  {id:"actara", nome:"Actara", grupo:"Inseticida", unidade:"g/1000L", obs:"Tiametoxam (IRAC 4A) — Mosca-branca, Pulgão (sistêmico)"},
  {id:"ampligo", nome:"Ampligo", grupo:"Inseticida", unidade:"ml/1000L", obs:"Clorantraniliprole + Lambda (IRAC 28+3A) — Traça, Lagartas"},
  {id:"maxim", nome:"Maxim XL", grupo:"Fungicida Solo", unidade:"ml/1000L", obs:"Fludioxonil + Metalaxil-M — Fusarium, Pythium, Rhizoctonia"},
  {id:"cobre_vermelho", nome:"Cobre Vermelho", grupo:"Fungicida/Bactericida", unidade:"g/1000L", obs:"Cobre (FRAC M01) — Bacterioses, Míldio"},
  {id:"korplan", nome:"Korplan", grupo:"Fungicida Solo", unidade:"ml/1000L", obs:"Fusarium, Pythium — doenças de solo"},
  {id:"cercobin", nome:"Cercobin", grupo:"Fungicida", unidade:"g/1000L", obs:"Tiofanato-metílico (FRAC B1) — Oídio, Botrytis"},
];

const COR_GRUPO = {
  "Fósforo/Nitrogênio":"#1a5a8a",
  "Cálcio/Nitrogênio":"#1a6a5a",
  "Correção/Cálcio":"#3a5a1a",
  "Potássio/Enxofre":"#6a4a1a",
  "Magnésio":"#4a1a6a",
  "Magnésio/Enxofre":"#5a2a7a",
  "Boro":"#1a4a6a",
  "NPK Complexo":"#1a5a3a",
  "Inseticida":"#7b2d00",
  "Fungicida":"#2d6a4f",
  "Bioestimulante":"#1a6a4a",
  "Biocontrole":"#2a6a1a",
};

// Estado
let selProd = {}; // {id: dose}
let filtroEstufa = 'Todas';
let confirmDelId = null;
let aplicacoes = [];

// API
function apiCall(params){
  const url = API + '?' + Object.keys(params).map(k=>k+'='+encodeURIComponent(params[k])).join('&');
  return fetch(url).then(r=>r.json());
}

async function carregarAplicacoes(){
  try {
    const res = await apiCall({action:'listar', tipo: SHEET_TYPE});
    if(res.ok){ aplicacoes = res.dados || []; renderHistorico(); }
    else { document.getElementById('historico').innerHTML='<div class="empty">Erro ao carregar dados</div>'; }
  } catch(e) {
    document.getElementById('historico').innerHTML='<div class="empty">Sem conexão com o servidor</div>';
  }
}

// Tabs
function showTab(t, btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  btn.classList.add('active');
  if(t==='historico') carregarAplicacoes();
}

// Dia da semana
function atualizarDiaSemana(){
  const data = document.getElementById('sel-data').value;
  if(!data){ document.getElementById('dia-semana').textContent=''; return; }
  const p = data.split('-');
  const dataFmt = p[2]+'/'+p[1]+'/'+p[0];
  document.getElementById('sel-data').dataset.fmt = dataFmt;
  const d = new Date(data+'T12:00:00');
  document.getElementById('dia-semana').textContent = '📅 '+DIAS[d.getDay()];
  atualizarBtn();
}

// Lista de produtos
function renderListaProd(){
  const q = document.getElementById('busca-prod').value.toLowerCase();
  const filtrados = PRODUTOS.filter(p=>p.nome.toLowerCase().includes(q)||p.grupo.toLowerCase().includes(q));
  document.getElementById('lista-prod').innerHTML = filtrados.map(p=>{
    const sel = selProd.hasOwnProperty(p.id);
    return `<div class="prod-item${sel?' sel':''}" id="item-${p.id}">
      <div class="prod-header" onclick="toggleProd('${p.id}')">
        <div class="chk${sel?' on':''}">${sel?'✓':''}</div>
        <div style="flex:1">
          <div class="prod-nome">${p.nome}</div>
          <div style="font-size:11px;color:#1a6a9a">${p.obs}</div>
        </div>
        <span class="prod-grupo" style="background:${COR_GRUPO[p.grupo]||'#1a4a7a'}">${p.grupo}</span>
      </div>
      ${sel ? `<div class="dose-row">
        <span style="font-size:11px;color:#42a5f5;margin-right:4px">Dose:</span>
        <input class="dose-input" type="number" placeholder="0" value="${selProd[p.id]||''}"
          oninput="setDose('${p.id}',this.value)" onclick="event.stopPropagation()">
        <span class="dose-unit">${p.unidade}</span>
      </div>` : ''}
    </div>`;
  }).join('');
  document.getElementById('count-prod').textContent = Object.keys(selProd).length;
  atualizarBtn();
}

function toggleProd(id){
  if(selProd.hasOwnProperty(id)){ delete selProd[id]; }
  else { selProd[id] = ''; }
  renderListaProd();
}

function setDose(id, val){ selProd[id] = val; atualizarBtn(); }

function atualizarBtn(){
  const data = document.getElementById('sel-data').value;
  document.getElementById('btn-salvar').disabled = !(Object.keys(selProd).length > 0 && data);
}

function setStatus(msg, cor){
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.style.color = cor || '#42a5f5';
}

async function salvarAplicacao(){
  const estufa = document.getElementById('sel-estufa').value;
  const data = document.getElementById('sel-data').value;
  const obs = document.getElementById('sel-obs').value;
  const d = new Date(data+'T12:00:00');
  const diaSemana = DIAS[d.getDay()];

  if(!data || Object.keys(selProd).length===0) return;

  // Montar string de produtos+doses
  const prodStr = Object.keys(selProd).map(id=>{
    const p = PRODUTOS.find(x=>x.id===id);
    const dose = selProd[id] || '0';
    return `${p?p.nome:id}:${dose} ${p?p.unidade:''}`;
  }).join('||');

  const btn = document.getElementById('btn-salvar');
  btn.disabled = true;
  btn.textContent = '⏳ Salvando...';
  setStatus('Salvando na planilha...','#64b5f6');

  try {
    const res = await apiCall({
      action: 'salvar',
      tipo: SHEET_TYPE,
      id: Date.now().toString(),
      estufa,
      data: document.getElementById('sel-data').dataset.fmt || data,
      diaSemana,
      produtos: prodStr,
      obs
    });
    if(res.ok){
      setStatus('✅ Salvo na planilha Google!','#42a5f5');
      selProd = {};
      document.getElementById('sel-obs').value = '';
      document.getElementById('busca-prod').value = '';
      renderListaProd();
      setTimeout(()=>setStatus('',''), 3000);
    } else {
      setStatus('⚠️ Erro: '+res.erro,'#e57373');
    }
  } catch(e){
    setStatus('⚠️ Sem conexão. Verifique internet.','#e57373');
  }
  btn.disabled = false;
  btn.textContent = '💾 Salvar Aplicação';
  atualizarBtn();
}

// Histórico
function renderFiltros(){
  const estufas=['Todas','Estufa 1','Estufa 2','Estufa 3','Estufa 4','Estufa 5','Estufa 6','Estufa 7'];
  document.getElementById('filtros-estufa').innerHTML = estufas.map(e=>
    `<button class="filter-btn${filtroEstufa===e?' active':''}" onclick="setFiltro('${e}')">${e}</button>`
  ).join('');
}

function setFiltro(e){ filtroEstufa=e; renderFiltros(); renderHistorico(); }

function fmtData(d){
  if(!d) return '';
  const s = d.toString().trim();
  if(/^[0-9]{2}\/[0-9]{2}\/[0-9]{2,4}$/.test(s)){const p=s.split('/');const yr=p[2].length===4?p[2].slice(2):p[2];return p[0]+'/'+p[1]+'/'+yr;}
  if(/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(s)){const p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0].slice(2);}
  if(/^[0-9]+(\.[0-9]+)?$/.test(s)){const dt=new Date(Math.round((parseFloat(s)-25569)*86400*1000));const dd=String(dt.getUTCDate()).padStart(2,'0');const mm=String(dt.getUTCMonth()+1).padStart(2,'0');const yy=String(dt.getUTCFullYear()).slice(2);return dd+'/'+mm+'/'+yy;}
  return s;
}

function renderHistorico(){
  const lista = filtroEstufa==='Todas' ? aplicacoes : aplicacoes.filter(a=>a.estufa===filtroEstufa);
  document.getElementById('count-hist').textContent = lista.length;
  const div = document.getElementById('historico');
  if(lista.length===0){ div.innerHTML='<div class="empty">Nenhuma aplicação registrada ainda</div>'; return; }

  div.innerHTML = lista.map(ap=>{
    const isC = confirmDelId===ap.id;
    // Parsear produtos
    let prodRows = '';
    if(ap.produtos){
      const prods = ap.produtos.toString().split('||');
      prodRows = prods.map(p=>{
        const parts = p.split(':');
        const nome = parts[0]||p;
        const dose = parts[1]||'';
        return `<div class="reg-prod-item">
          <span class="reg-prod-nome">${nome}</span>
          ${dose?`<span class="reg-prod-dose">${dose}</span>`:''}
        </div>`;
      }).join('');
    }

    return `<div class="reg-card">
      <div class="reg-header">
        <div>
          <span class="reg-estufa">${ap.estufa}</span>
          <div class="reg-info">📅 ${fmtData(ap.data)}${ap.diaSemana?' · '+ap.diaSemana:''}</div>
        </div>
        ${isC
          ?`<div class="del-confirm"><button class="del-yes" onclick="deletar('${ap.id}')">Confirmar</button><button class="del-no" onclick="cancelDel()">Cancelar</button></div>`
          :`<button class="del-btn" onclick="askDel('${ap.id}')">🗑 Excluir</button>`}
      </div>
      <div class="reg-produtos">${prodRows}</div>
      ${ap.obs?`<div class="reg-obs">📝 ${ap.obs}</div>`:''}
    </div>`;
  }).join('');
}

function askDel(id){ confirmDelId=id; renderHistorico(); }
function cancelDel(){ confirmDelId=null; renderHistorico(); }

async function deletar(id){
  try {
    const res = await apiCall({action:'deletar', tipo: SHEET_TYPE, id});
    if(res.ok){ aplicacoes=aplicacoes.filter(a=>a.id!=id); confirmDelId=null; renderHistorico(); }
    else alert('Erro ao excluir: '+res.erro);
  } catch(e){ alert('Sem conexão.'); }
}

// Init
document.getElementById('sel-data').value = new Date().toISOString().split('T')[0];
atualizarDiaSemana();
renderListaProd();
renderFiltros();
</script>
