<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Pulverizações</title>
<style>
  :root{
    --bg:#F2F5EF; --ink:#1D2B22; --leaf:#234D35; --leaf-dark:#173425;
    --paper:#FFFFFF; --line:#DCE3D8; --pend:#C68A2E; --feito:#3D7A5C; --danger:#B5432F;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding-bottom:100px;}
  header{background:var(--leaf-dark); color:#fff; padding:16px 20px 20px; position:sticky; top:0; z-index:5;}
  header a{color:#CFE0D3; text-decoration:none; font-size:13px;}
  header h1{margin:6px 0 0; font-size:20px;}
  .tabs{display:flex; gap:8px; margin:14px 20px 0;}
  .tab{flex:1; text-align:center; padding:9px 0; border-radius:9px; font-size:13px; background:var(--paper); border:1px solid var(--line); cursor:pointer; color:var(--ink);}
  .tab.active{background:var(--leaf); color:#fff; border-color:var(--leaf);}
  main{padding:16px 20px;}
  .empty{text-align:center; color:#6C7A67; font-size:14px; margin-top:40px;}
  .item{background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px;}
  .item-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .badge{
    font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:12px; font-weight:600;
    background:var(--leaf); color:#fff; padding:3px 9px; border-radius:6px; white-space:nowrap;
  }
  .status{font-size:11px; padding:3px 8px; border-radius:20px; font-weight:600; text-transform:uppercase; letter-spacing:.03em;}
  .status.pendente{background:#FBEBD3; color:var(--pend);}
  .status.feito{background:#DCEFE3; color:var(--feito);}
  .status.atrasado{background:#F7DAD2; color:var(--danger);}
  .group-header{font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:#6C7A67; margin:22px 0 8px; padding-bottom:4px; border-bottom:1px solid var(--line);}
  .group-header:first-child{margin-top:0;}
  .item h3{margin:8px 0 2px; font-size:16px;}
  .item p{margin:0; font-size:13px; color:#54614F;}
  .item .meta{font-size:12px; color:#8A968A; margin-top:6px;}
  .item .actions{display:flex; gap:8px; margin-top:10px;}
  .item button{flex:1; border:none; border-radius:8px; padding:9px 0; font-size:13px; font-weight:600;}
  .btn-done{background:var(--feito); color:#fff;}
  .btn-edit{background:transparent; color:var(--leaf); border:1px solid var(--leaf) !important;}
  .btn-del{background:transparent; color:var(--danger); border:1px solid var(--danger) !important;}
  .fab{
    position:fixed; bottom:22px; right:20px; left:20px; max-width:420px; margin:0 auto;
    background:var(--leaf); color:#fff; border:none; border-radius:14px; padding:16px;
    font-size:16px; font-weight:600; box-shadow:0 4px 14px rgba(23,52,37,.35);
  }
  dialog{border:none; border-radius:16px; width:min(92vw,420px); padding:0;}
  dialog::backdrop{background:rgba(23,52,37,.45);}
  .sheet{padding:20px;}
  .sheet h2{margin:0 0 16px; font-size:18px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:#54614F; margin-bottom:5px;}
  .field select, .field input, .field textarea{
    width:100%; padding:10px; border:1px solid var(--line); border-radius:9px; font-size:15px; background:#fff;
  }
  .row2{display:flex; gap:10px;}
  .row2 .field{flex:1;}
  .sheet-actions{display:flex; gap:10px; margin-top:14px;}
  .sheet-actions button{flex:1; padding:12px; border-radius:9px; border:none; font-size:15px; font-weight:600;}
  .btn-cancel{background:#EDEFEA; color:var(--ink);}
  .btn-save{background:var(--leaf); color:#fff;}
  .loading{text-align:center; color:#8A968A; font-size:13px; margin-top:20px;}
  .prod-row{display:flex; gap:8px; margin-bottom:8px; align-items:center;}
  .prod-row input{flex:1; padding:9px; border:1px solid var(--line); border-radius:8px; font-size:14px;}
  .prod-row input.dose-input{flex:0 0 34%;}
  .prod-row .rm-row{flex:0 0 auto; width:32px; height:32px; border:none; background:#F3E4E0; color:var(--danger); border-radius:8px; font-size:16px; line-height:1;}
  .add-row{width:100%; padding:9px; border:1px dashed var(--line); border-radius:8px; background:transparent; color:var(--leaf); font-size:13px; font-weight:600; margin-bottom:14px;}
  .prod-list{margin:8px 0 0; padding:0; list-style:none;}
  .prod-list li{display:flex; justify-content:space-between; gap:10px; font-size:13.5px; padding:5px 0; border-bottom:1px dashed var(--line);}
  .prod-list li:last-child{border-bottom:none;}
  .prod-list .p-nome{color:var(--ink);}
  .prod-list .p-dose{color:#54614F; font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:12.5px; white-space:nowrap;}
</style>
</head>
<body>
<header>
  <a href="index.html">‹ voltar</a>
  <h1>Pulverizações</h1>
  <div class="tabs">
    <div class="tab active" data-f="pendente">Pendentes</div>
    <div class="tab" data-f="feito">Feitas</div>
    <div class="tab" data-f="todas">Todas</div>
  </div>
</header>
<main id="list"><div class="loading">Carregando…</div></main>

<button class="fab" onclick="openForm()">+ Nova pulverização</button>

<dialog id="dialog">
  <div class="sheet">
    <h2 id="dlgTitle">Nova pulverização</h2>
    <div class="row2">
      <div class="field">
        <label>Estufa</label>
        <select id="fEstufa">
          <option value="1">Estufa 1</option><option value="2">Estufa 2</option>
          <option value="3">Estufa 3</option><option value="4">Estufa 4</option>
          <option value="5">Estufa 5</option><option value="6">Estufa 6</option>
          <option value="7">Estufa 7</option>
        </select>
      </div>
      <div class="field">
        <label>Situação</label>
        <select id="fStatus">
          <option value="pendente">Precisa fazer</option>
          <option value="feito">Já foi feito</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Produtos e doses</label>
      <div id="produtosList"></div>
      <button type="button" class="add-row" onclick="addProdutoRow()">+ Adicionar produto</button>
    </div>
    <div class="field">
      <label>Alvo / motivo</label>
      <input id="fAlvo" type="text" placeholder="ex: requeima, mosca branca...">
    </div>
    <div class="field">
      <label>Data (prevista ou feita)</label>
      <input id="fData" type="date">
    </div>
    <div class="field">
      <label>Observação</label>
      <textarea id="fObs" rows="2"></textarea>
    </div>
    <div class="sheet-actions">
      <button class="btn-cancel" onclick="closeForm()">Cancelar</button>
      <button class="btn-save" onclick="salvar()">Salvar</button>
    </div>
  </div>
</dialog>

<script src="config.js"></script>
<script>
let dados = [];
let filtro = 'pendente';

async function carregar(){
  document.getElementById('list').innerHTML = '<div class="loading">Carregando…</div>';
  try{
    const r = await fetch(`${API_URL}?tipo=pulverizacao`);
    const j = await r.json();
    dados = (j.data || []).sort((a,b)=> new Date(b.dataCriacao) - new Date(a.dataCriacao));
    render();
  }catch(e){
    document.getElementById('list').innerHTML = '<div class="loading">Erro ao carregar. Confira a URL em config.js.</div>';
  }
}

function isAtrasado(d){
  if(d.status === 'feito' || !d.dataPrevista) return false;
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const dt = new Date(d.dataPrevista + 'T00:00:00');
  return dt < hoje;
}

function parseProdutos(d){
  // Registros novos guardam um array JSON em d.produto. Registros antigos têm texto simples.
  if(!d.produto) return [];
  try{
    const parsed = JSON.parse(d.produto);
    if(Array.isArray(parsed)) return parsed;
  }catch(e){}
  return [{ nome: d.produto, dose: d.dose || '' }];
}

function itemCard(d){
  const atrasado = isAtrasado(d);
  const statusLabel = d.status === 'feito' ? 'Feito' : (atrasado ? 'Atrasado' : 'Pendente');
  const statusClass = d.status === 'feito' ? 'feito' : (atrasado ? 'atrasado' : 'pendente');
  const produtos = parseProdutos(d);
  const tituloProdutos = produtos.length
    ? produtos.map(p => escapeHtml(p.nome)).join(' + ')
    : '(produto não informado)';
  const listaProdutos = produtos.length > 1
    ? `<ul class="prod-list">${produtos.map(p => `<li><span class="p-nome">${escapeHtml(p.nome)}</span>${p.dose ? `<span class="p-dose">${escapeHtml(p.dose)}</span>` : ''}</li>`).join('')}</ul>`
    : (produtos[0] && produtos[0].dose ? `<p>Dose: ${escapeHtml(produtos[0].dose)}</p>` : '');
  return `
    <div class="item">
      <div class="item-top">
        <span class="badge">Estufa ${d.estufa}</span>
        <span class="status ${statusClass}">${statusLabel}</span>
      </div>
      <h3>${tituloProdutos}</h3>
      ${listaProdutos}
      ${d.alvo ? `<p>Alvo: ${escapeHtml(d.alvo)}</p>` : ''}
      ${d.obs ? `<p>${escapeHtml(d.obs)}</p>` : ''}
      <div class="meta">${d.status === 'feito' ? (d.dataExecucao ? 'Feito em ' + fmtData(d.dataExecucao) : '') : (d.dataPrevista ? 'Previsto para ' + fmtData(d.dataPrevista) : 'Sem data definida')}</div>
      <div class="actions">
        ${d.status !== 'feito' ? `<button class="btn-done" onclick="marcarFeito('${d.id}')">Marcar como feito</button>` : ''}
        <button class="btn-edit" onclick="editarItem('${d.id}')">Editar</button>
        <button class="btn-del" onclick="excluir('${d.id}')">Excluir</button>
      </div>
    </div>
  `;
}

function render(){
  const list = document.getElementById('list');
  let itens = dados;
  if(filtro !== 'todas') itens = dados.filter(d => d.status === filtro);
  if(itens.length === 0){
    list.innerHTML = '<div class="empty">Nada por aqui.</div>';
    return;
  }

  if(filtro === 'feito'){
    itens = itens.slice().sort((a,b) => new Date(b.dataExecucao||b.dataCriacao) - new Date(a.dataExecucao||a.dataCriacao));
    list.innerHTML = itens.map(itemCard).join('');
    return;
  }

  // pendentes (e "todas"): agrupa por data prevista, mais próxima primeiro
  itens = itens.slice().sort((a,b) => {
    if(!a.dataPrevista) return 1;
    if(!b.dataPrevista) return -1;
    return new Date(a.dataPrevista) - new Date(b.dataPrevista);
  });
  let html = '';
  let grupoAtual = null;
  itens.forEach(d => {
    const chave = d.dataPrevista || 'sem-data';
    if(chave !== grupoAtual){
      grupoAtual = chave;
      const titulo = d.dataPrevista ? fmtData(d.dataPrevista) : 'Sem data definida';
      html += `<div class="group-header">${titulo}</div>`;
    }
    html += itemCard(d);
  });
  list.innerHTML = html;
}

function fmtData(v){
  const dt = new Date(v.length === 10 ? v + 'T00:00:00' : v);
  if(isNaN(dt)) return v;
  return dt.toLocaleDateString('pt-BR');
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  filtro = t.dataset.f;
  render();
}));

function hojeISO(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}

let prodRowCount = 0;
function addProdutoRow(nome, dose){
  prodRowCount++;
  const id = 'row' + prodRowCount;
  const wrap = document.getElementById('produtosList');
  const row = document.createElement('div');
  row.className = 'prod-row';
  row.id = id;
  row.innerHTML = `
    <input type="text" class="nome-input" placeholder="Produto (ex: Amistar Top)" value="${nome ? escapeHtml(nome) : ''}">
    <input type="text" class="dose-input" placeholder="Dose (ex: 40ml/100L)" value="${dose ? escapeHtml(dose) : ''}">
    <button type="button" class="rm-row" onclick="removeProdutoRow('${id}')">×</button>
  `;
  wrap.appendChild(row);
}
function removeProdutoRow(id){
  const row = document.getElementById(id);
  if(row) row.remove();
  // nunca deixa a lista vazia
  if(document.querySelectorAll('#produtosList .prod-row').length === 0) addProdutoRow();
}
function resetProdutosRows(){
  document.getElementById('produtosList').innerHTML = '';
  prodRowCount = 0;
  addProdutoRow();
  addProdutoRow();
  addProdutoRow();
}

let editandoId = null;

function openForm(){
  editandoId = null;
  document.getElementById('dlgTitle').textContent = 'Nova pulverização';
  document.getElementById('fEstufa').value='1';
  document.getElementById('fStatus').value='pendente';
  document.getElementById('fAlvo').value='';
  document.getElementById('fData').value=hojeISO();
  document.getElementById('fObs').value='';
  resetProdutosRows();
  document.getElementById('dialog').showModal();
}

function editarItem(id){
  const d = dados.find(x => x.id === id);
  if(!d) return;
  editandoId = id;
  document.getElementById('dlgTitle').textContent = 'Editar pulverização';
  document.getElementById('fEstufa').value = d.estufa || '1';
  document.getElementById('fStatus').value = d.status || 'pendente';
  document.getElementById('fAlvo').value = d.alvo || '';
  document.getElementById('fData').value = (d.status === 'feito' ? d.dataExecucao : d.dataPrevista) || hojeISO();
  document.getElementById('fObs').value = d.obs || '';

  document.getElementById('produtosList').innerHTML = '';
  prodRowCount = 0;
  const produtos = parseProdutos(d);
  if(produtos.length){
    produtos.forEach(p => addProdutoRow(p.nome, p.dose));
  } else {
    addProdutoRow();
  }
  addProdutoRow(); // uma linha extra em branco pra facilitar adicionar mais

  document.getElementById('dialog').showModal();
}

function closeForm(){ document.getElementById('dialog').close(); }

async function salvar(){
  const status = document.getElementById('fStatus').value;
  const data = document.getElementById('fData').value;
  const produtos = Array.from(document.querySelectorAll('#produtosList .prod-row')).map(row => ({
    nome: row.querySelector('.nome-input').value.trim(),
    dose: row.querySelector('.dose-input').value.trim()
  })).filter(p => p.nome);

  const campos = {
    estufa: document.getElementById('fEstufa').value,
    produto: JSON.stringify(produtos),
    alvo: document.getElementById('fAlvo').value,
    dose: '',
    obs: document.getElementById('fObs').value,
    status: status,
    dataPrevista: status === 'pendente' ? data : '',
    dataExecucao: status === 'feito' ? data : ''
  };
  closeForm();
  if(editandoId){
    await fetch(API_URL, {method:'POST', body: JSON.stringify({tipo:'pulverizacao', action:'update', id: editandoId, data: campos})});
  } else {
    await fetch(API_URL, {method:'POST', body: JSON.stringify({tipo:'pulverizacao', action:'add', data: campos})});
  }
  carregar();
}

async function marcarFeito(id){
  await fetch(API_URL, {method:'POST', body: JSON.stringify({
    tipo:'pulverizacao', action:'update', id,
    data:{ status:'feito', dataExecucao: hojeISO() }
  })});
  carregar();
}

async function excluir(id){
  if(!confirm('Excluir este registro?')) return;
  await fetch(API_URL, {method:'POST', body: JSON.stringify({tipo:'pulverizacao', action:'delete', id})});
  carregar();
}

carregar();
</script>
</body>
</html>
